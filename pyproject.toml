[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queenbee"
version = "0.3.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = ["lab: preuves de failles sur labs/vulnerable_queenbee.py (local uniquement)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]

[tool.importlinter]
root_package = "queenbee"

[[tool.importlinter.contracts]]
name = "Hexagone : adapters -> application -> domain (jamais l'inverse)"
type = "layers"
layers = [
    "queenbee.adapters",
    "queenbee.application",
    "queenbee.domain",
]

[tool.bandit]
exclude_dirs = ["tests", "labs"]
